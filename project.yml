name: ForkCalendar
options:
  bundleIdPrefix: com.cwandt
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: false
targets:
  ForkCalendar:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.mac
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.11.2"
        CFBundleVersion: "30"
        NSCalendarsFullAccessUsageDescription: Fork Calendar shows and edits events from your calendars.
        NSCalendarsUsageDescription: Fork Calendar shows and edits events from your calendars.
        NSHumanReadableCopyright: © 2026 CW&T
    entitlements:
      path: Support/ForkCalendar-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
  ForkCalendar-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.11.2"
        CFBundleVersion: "30"
        NSCalendarsFullAccessUsageDescription: Fork Calendar shows and edits events from your calendars.
        NSCalendarsUsageDescription: Fork Calendar shows and edits events from your calendars.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
