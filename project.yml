name: ForkCalendar
options:
  bundleIdPrefix: com.cwandt
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: false
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  ForkCalendar:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.mac
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.16.1"
        CFBundleVersion: "106"
        NSHumanReadableCopyright: © 2026 CW&T
        ATSApplicationFontsPath: .
        SUFeedURL: https://www.experiments.cwandt.com/forkcalendar/appcast.xml
        SUPublicEDKey: IsZ2LtddRqNHFHsp6U40Gw/A6sWIJO4m5xJYr1r4qic=
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true  # required for sandboxed apps
    entitlements:
      path: Support/ForkCalendar-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.temporary-exception.mach-lookup.global-name:  # Sparkle XPC services
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
  ForkCalendar-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.16.1"
        CFBundleVersion: "106"
        UIAppFonts:
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Support/ForkCalendar-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cwandt.forkcalendar
    dependencies:
      - target: ForkCalendarWidgets
  ForkCalendarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/App/Theme.swift
      - Sources/App/WidgetShared.swift
      - Sources/Utilities/ColorUtils.swift
      - Sources/Utilities/DateUtils.swift
      - Sources/Fonts
    settings:
      base:
        PRODUCT_NAME: ForkCalendarWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: Support/Info-Widgets.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.16.1"
        CFBundleVersion: "106"
        UIAppFonts:
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/ForkCalendarWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cwandt.forkcalendar
